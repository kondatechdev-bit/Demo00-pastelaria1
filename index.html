<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doce Huambo — Pastelaria Artesanal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <span class="logo">Doce<span class="logo-accent">Huambo</span></span>
      <nav class="nav">
        <a href="#produtos">Produtos</a>
        <a href="#sobre">Sobre</a>
        <a href="#contacto">Contacto</a>
      </nav>
      <a class="btn-whatsapp" id="wa-header" target="_blank" rel="noopener">Encomendar</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <p class="eyebrow">Padaria & Confeitaria</p>
      <h1 id="hero-titulo"></h1>
      <p class="hero-slogan" id="hero-slogan"></p>
      <a class="btn-primary" id="wa-hero" target="_blank" rel="noopener">Fazer encomenda no WhatsApp</a>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <div class="bun bun-1"></div>
      <div class="bun bun-2"></div>
      <div class="bun bun-3"></div>
    </div>
  </section>

  <section class="sobre" id="sobre">
    <h2 id="sobre-titulo"></h2>
    <p id="sobre-texto"></p>
  </section>

  <section class="produtos" id="produtos">
    <h2>O que temos hoje</h2>
    <div class="grid-produtos" id="grid-produtos"></div>
  </section>

  <section class="galeria" id="galeria-container"></section>

  <section class="contacto" id="contacto">
    <h2>Venha nos visitar</h2>
    <div class="contacto-grid">
      <div class="contacto-info">
        <p><strong>Endereço</strong><br><span id="c-endereco"></span></p>
        <p><strong>Horário</strong><br><span id="c-horario"></span></p>
        <p><strong>Telefone</strong><br><span id="c-telefone"></span></p>
        <p><strong>Email</strong><br><span id="c-email"></span></p>
      </div>
      <a class="btn-primary" id="wa-footer" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; <span id="ano"></span> <span id="footer-nome"></span>. Site por Konda.</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
